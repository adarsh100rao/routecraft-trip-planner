server:
  port: ${PORT:8080}

spring:
  application:
    name: trip-planner-engine
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripplanner}
    username: ${DB_USER:tripuser}
    password: ${DB_PASSWORD:trippassword}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      max-lifetime: 240000
      keepalive-time: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1500ms

tripengine:
  tile:
    grid-size-degrees: 0.08
    ttl-days: 7
    default-search-radius-meters: 15000
    expanded-search-radius-meters: 30000
  external:
    nominatim-base-url: https://nominatim.openstreetmap.org
    overpass-base-url: https://overpass-api.de/api/interpreter
    osrm-base-url: https://router.project-osrm.org
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    user-agent: "TripPlannerEngine/0.1 (constraint-based-itinerary-optimizer)"
    timeout-ms: 20000
    osrm-timeout-ms: 3500

resilience4j:
  circuitbreaker:
    instances:
      osrm:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      overpass:
        slidingWindowSize: 6
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app,https://*.netlify.app}
