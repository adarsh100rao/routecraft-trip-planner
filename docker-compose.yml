services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: trip-planner-postgis
    environment:
      POSTGRES_DB: tripplanner
      POSTGRES_USER: tripuser
      POSTGRES_PASSWORD: trippassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripuser -d tripplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trip-planner-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgis_data:
